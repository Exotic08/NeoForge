name: Build NeoForge Server

on:
  workflow_dispatch:
    inputs:
      serverpack_url:
        description: 'Direct download link to the server pack .zip'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download server pack
        run: |
          curl -L -o serverpack.zip "${{ github.event.inputs.serverpack_url }}"
          mkdir -p server
          unzip -o serverpack.zip -d server

      - name: Run installer (if present)
        working-directory: server
        run: |
          if [ -f installer.jar ]; then
            java -jar installer.jar --installServer
          fi

      - name: Zip result
        working-directory: server
        run: zip -r ../server-output.zip . -x "*.zip" "installer.jar"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-server
          path: server-output.zip
          retention-days: 7
